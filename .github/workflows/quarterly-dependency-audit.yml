name: Quarterly dependency audit

on:
  schedule:
    - cron: '43 3 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-nuget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore .\AIHelper.sln

      - name: Report outdated packages
        run: dotnet list .\AIHelper.sln package --outdated --include-transitive

      - name: Fail on vulnerable packages
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $report = (& dotnet list .\AIHelper.sln package --vulnerable --include-transitive --format json) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability audit command failed.' }
          $vulnerable = @()
          foreach ($project in @($report.projects)) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($groupName in @('topLevelPackages', 'transitivePackages')) {
                $group = $framework.PSObject.Properties[$groupName]
                if ($null -eq $group) { continue }
                foreach ($package in @($group.Value)) {
                  if (@($package.vulnerabilities).Count -gt 0) { $vulnerable += "$($project.path):$($package.id)" }
                }
              }
            }
          }
          if ($vulnerable.Count -gt 0) { throw "Known NuGet vulnerabilities found: $($vulnerable -join ', ')" }

  audit-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-data-server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Fail on vulnerable Python dependencies
        run: pip-audit
