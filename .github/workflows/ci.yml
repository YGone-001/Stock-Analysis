name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore .\AIHelper.sln

      - name: Build solution (Release)
        run: dotnet build .\AIHelper.sln -c Release --no-restore

      - name: Test solution (Release)
        run: dotnet test .\AIHelper.sln -c Release --no-build

  market-data-server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-data-server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile gateway
        run: python -m compileall app

      - name: Run offline smoke tests
        run: pytest -q
