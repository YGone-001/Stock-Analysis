name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version in X.Y.Z format; manual runs create artifacts only.
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-package-windows:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate and resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Release tag '$env:REF_NAME' must use vX.Y.Z."
            }
            $version = $env:REF_NAME.Substring(1)
            $tag = $env:REF_NAME
          }
          else {
            if ($env:INPUT_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Manual release version '$env:INPUT_VERSION' must use X.Y.Z."
            }
            $version = $env:INPUT_VERSION
            $tag = 'manual'
          }
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "artifact_name=AIHelper-$version-win-x64" >> $env:GITHUB_OUTPUT

      - name: Restore solution and win-x64 dependencies
        shell: pwsh
        run: |
          dotnet restore .\AIHelper.sln -r win-x64 -p:Version=${{ steps.version.outputs.release_version }}
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }

      - name: Build solution (Release)
        shell: pwsh
        run: |
          dotnet build .\AIHelper.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.release_version }} -p:AssemblyVersion=${{ steps.version.outputs.release_version }}.0 -p:FileVersion=${{ steps.version.outputs.release_version }}.0 -p:InformationalVersion=${{ steps.version.outputs.release_version }}
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Test solution (Release)
        shell: pwsh
        run: |
          dotnet test .\AIHelper.sln -c Release --no-build -p:Version=${{ steps.version.outputs.release_version }} -p:AssemblyVersion=${{ steps.version.outputs.release_version }}.0 -p:FileVersion=${{ steps.version.outputs.release_version }}.0 -p:InformationalVersion=${{ steps.version.outputs.release_version }}
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed.' }

      - name: Publish fresh self-contained win-x64 output
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          PUBLISH_DIRECTORY: ${{ runner.temp }}\AIHelper-publish-${{ github.run_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:PUBLISH_DIRECTORY) { throw "Publish staging directory must be fresh: $env:PUBLISH_DIRECTORY" }
          dotnet publish .\src\AIHelper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -p:Version=$env:RELEASE_VERSION -p:AssemblyVersion=$env:RELEASE_VERSION.0 -p:FileVersion=$env:RELEASE_VERSION.0 -p:InformationalVersion=$env:RELEASE_VERSION -o $env:PUBLISH_DIRECTORY
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

      - name: Package, hash, and prove release artifact
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PUBLISH_DIRECTORY: ${{ runner.temp }}\AIHelper-publish-${{ github.run_id }}
          RELEASE_DIRECTORY: ${{ runner.temp }}\AIHelper-release-${{ github.run_id }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          .\tools\package-release.ps1 -Version $env:RELEASE_VERSION -PublishDirectory $env:PUBLISH_DIRECTORY -OutputDirectory $env:RELEASE_DIRECTORY -GitCommit $env:GIT_COMMIT -GitTag $env:RELEASE_TAG

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}\AIHelper-release-${{ github.run_id }}\AIHelper-${{ steps.version.outputs.release_version }}-win-x64.zip
            ${{ runner.temp }}\AIHelper-release-${{ github.run_id }}\SHA256SUMS.txt
            ${{ runner.temp }}\AIHelper-release-${{ github.run_id }}\release-manifest.json
          if-no-files-found: error
          retention-days: 14

  create-github-release:
    if: github.event_name == 'push'
    needs: build-package-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Verify GitHub CLI availability
        shell: pwsh
        run: gh --version

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-package-windows.outputs.artifact_name }}
          path: release-assets

      - name: Create immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-package-windows.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build-package-windows.outputs.release_version }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $previousNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG 2>$null
          $releaseViewExitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $previousNativeErrorPreference
          if ($releaseViewExitCode -eq 0) { throw "GitHub Release '$env:RELEASE_TAG' already exists; refusing to overwrite release assets." }
          gh release create $env:RELEASE_TAG .\release-assets\AIHelper-$env:RELEASE_VERSION-win-x64.zip .\release-assets\SHA256SUMS.txt .\release-assets\release-manifest.json --title "AIHelper v$env:RELEASE_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
